name: Release

# Pushing a version tag (v0.1.0) builds the image for amd64 and arm64, checks it
# the same way CI does, pushes it to GHCR and drafts a GitHub release. The tag
# must match the version in pyproject.toml.
#
#   git tag -a v0.1.0 -m "QuenWard 0.1.0" && git push origin v0.1.0

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write   # the draft release
  packages: write   # pushing to ghcr.io

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n1)"
          if [ "$version" != "$declared" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $declared in pyproject.toml"
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$image:$version"
          # A plain x.y.z release also moves x.y and latest; a pre-release
          # (0.2.0-rc.1) gets only its own tag.
          if [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            tags="$tags,$image:${BASH_REMATCH[1]}.${BASH_REMATCH[2]},$image:latest"
          fi
          {
            echo "VERSION=$version"
            echo "IMAGE=$image"
            echo "TAGS=$tags"
          } >> "$GITHUB_ENV"
          echo "Will push: $tags"

      # The same checks as CI, on the amd64 image, before anything is pushed.
      - name: Build (amd64) for checking
        run: docker build -t quenward:release .

      - name: Docker CLI and compose plugin are in the image
        run: docker run --rm --entrypoint docker quenward:release compose version

      - name: Runs as its own unprivileged user (46337:46337)
        run: test "$(docker run --rm --entrypoint id quenward:release)" = "uid=46337(app) gid=46337(app) groups=46337(app)"

      - name: Smoke test the running container
        run: |
          docker run -d --name app -p 127.0.0.1:5005:5005 \
            --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true \
            quenward:release
          for _ in $(seq 1 30); do
            if [ "$(curl -fsS http://127.0.0.1:5005/healthz)" = "ok" ]; then
              curl -fsS http://127.0.0.1:5005/ | grep -q '<div id="app">'
              exit 0
            fi
            sleep 1
          done
          docker logs app
          exit 1

      - name: Trivy image scan
        run: .github/scripts/trivy-scan.sh quenward:release

      # arm64 is built under emulation. QEMU comes from Ubuntu's own (signed)
      # packages rather than a third-party action or image.
      - name: QEMU for arm64
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-user-static
          # Containers can only use the emulator if it is registered with the
          # F (fix binary) flag.
          grep -q '^flags: .*F' /proc/sys/fs/binfmt_misc/qemu-aarch64

      - name: Multi-platform builder
        run: |
          docker buildx create --name release --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # With an SBOM and build provenance attached, so anyone can see what is
      # in the image and that this workflow built it.
      - name: Build and push (amd64 + arm64)
        run: |
          tag_args=()
          IFS=, read -ra tags <<< "$TAGS"
          for tag in "${tags[@]}"; do tag_args+=(--tag "$tag"); done
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            "${tag_args[@]}" \
            --label "org.opencontainers.image.title=QuenWard" \
            --label "org.opencontainers.image.description=Self-hosted web UI for managing Docker Compose stacks" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.licenses=MIT" \
            --sbom=true \
            --provenance=mode=max \
            --push \
            .

      - name: Show what was pushed
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"

      # A draft: nothing is announced until it is reviewed and published by hand.
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          [[ "$VERSION" == 0.* || "$VERSION" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" --draft $prerelease \
            --title "QuenWard $VERSION" --generate-notes

      - name: App log
        if: always()
        run: docker logs app 2>&1 | tail -n 100 || true
