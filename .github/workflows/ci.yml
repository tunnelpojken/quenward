name: CI

on:
  push:
  pull_request:

# The workflow only needs to read the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies (must match uv.lock exactly)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Formatting
        run: uv run ruff format --check .

      - name: Bandit (insecure Python patterns)
        run: uv run bandit -c pyproject.toml -r app

      - name: pip-audit (known vulnerabilities in dependencies)
        run: uv run pip-audit

      - name: Tests
        run: uv run pytest

  # The same scenarios against a real Docker daemon (GitHub's runners have one):
  # creating, stopping, restarting and updating real compose stacks.
  docker-integration:
    name: docker-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies (must match uv.lock exactly)
        run: uv sync --locked

      - name: Docker and Compose versions
        run: docker version --format '{{.Server.Version}}' && docker compose version

      - name: Real-Docker tests
        env:
          DOCKER_TESTS: "1"
        run: uv run pytest tests/test_docker_integration.py -v

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (must match package-lock.json exactly)
        run: npm ci --no-fund

      - name: npm audit (known vulnerabilities)
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

  docker:
    name: docker
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t quenward:ci .

      - name: Docker CLI and compose plugin are in the image
        run: docker run --rm --entrypoint docker quenward:ci compose version

      - name: Runs as its own unprivileged user (46337:46337)
        run: test "$(docker run --rm --entrypoint id quenward:ci)" = "uid=46337(app) gid=46337(app) groups=46337(app)"

      - name: Smoke test the running container
        run: |
          docker run -d --name app -p 127.0.0.1:5005:5005 \
            --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true \
            quenward:ci
          for _ in $(seq 1 30); do
            if [ "$(curl -fsS http://127.0.0.1:5005/healthz)" = "ok" ]; then
              curl -fsS http://127.0.0.1:5005/ | grep -q '<div id="app">'
              echo "Container is healthy and serves the frontend"
              exit 0
            fi
            sleep 1
          done
          docker logs app
          exit 1

      # ZAP baseline: passive checks of every response (headers, cookies, CSP,
      # error pages). Fails on Medium or High. The plan is in .github/zap/.
      # ZAP comes from its GitHub release, pinned by SHA-256.
      - name: ZAP baseline scan
        env:
          ZAP_VERSION: "2.17.0"
          ZAP_SHA256: efe799aaa3627db683b43f00c9c210aea0b75c00cc8f0a0f0434d12bb3ddde5a
          ZAP_REPORT_DIR: ${{ runner.temp }}/zap-report
        run: |
          java -version
          cd "$RUNNER_TEMP"
          curl -fsSLo zap.tar.gz "https://github.com/zaproxy/zaproxy/releases/download/v${ZAP_VERSION}/ZAP_${ZAP_VERSION}_Linux.tar.gz"
          echo "${ZAP_SHA256}  zap.tar.gz" | sha256sum --check --strict
          tar -xzf zap.tar.gz
          mkdir -p "$ZAP_REPORT_DIR"
          status=0
          "./ZAP_${ZAP_VERSION}/zap.sh" -cmd -silent -dir "$RUNNER_TEMP/zap-home" \
            -autorun "$GITHUB_WORKSPACE/.github/zap/baseline.yaml" || status=$?
          echo "Alerts:"
          jq -r '.site[].alerts[] | "  \(.riskdesc) | \(.name) | \(.count)"' \
            "$ZAP_REPORT_DIR/zap-baseline.json" || true
          exit $status

      # Trivy: known vulnerabilities (and stray secrets) in the image, from the OS
      # packages to the Python packages and the Docker CLI binaries. Fails on HIGH
      # or CRITICAL ones that have a fix available. See the script for details.
      - name: Trivy image scan
        run: .github/scripts/trivy-scan.sh quenward:ci

      - name: App log
        if: always()
        run: docker logs app 2>&1 | tail -n 100 || true
