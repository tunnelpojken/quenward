[project]
name = "docker-project"
version = "0.1.0"
description = "Self-hosted web UI for managing Docker Compose stacks"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.161.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "httpx2>=2.16.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.uv]
# The app is run from source, not installed as a package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle / pyflakes
    "I",            # import order
    "B",            # bugbear
    "UP",           # modern syntax
    "S",            # security (bandit rules)
    "SIM",          # simplifications
]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest works
"tests/**" = ["S101"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
