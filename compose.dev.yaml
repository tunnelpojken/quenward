# Development compose file. From the repository folder:
#
#   echo "DOCKER_GID=$(stat -c %g /var/run/docker.sock)" > .env
#   docker compose -f compose.dev.yaml up --build -d
#
# Then open http://127.0.0.1:5005

services:
  app:
    build: .
    image: docker-project:dev
    container_name: docker-project-dev
    restart: unless-stopped
    ports:
      # Only reachable from this machine, never from the network.
      - "127.0.0.1:5005:5005"
    environment:
      # The stacks folder is mounted at the same path as on the host: compose
      # records that path on every container, and that is how containers are
      # matched to their stack folder.
      STACKS_DIR: ${PWD}/dev-stacks
      # Terminal transcripts are off without a key. To try them, see "Terminal"
      # in the README, then uncomment this and the matching volume below.
      # TRANSCRIPT_KEY_FILE: /run/secrets/transcript.key
    # Access to the Docker socket is root-equivalent on this machine. The app
    # gets it through the socket's group instead of running as root. Set
    # DOCKER_GID in .env as shown above.
    group_add:
      - "${DOCKER_GID:?Set DOCKER_GID in .env first, see the top of this file}"
    volumes:
      - data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      # Writable for the compose editor. The app (user 46337) still needs write
      # permission on each stack folder and compose file: see the README.
      - ${PWD}/dev-stacks:${PWD}/dev-stacks
      # - ./secrets/transcript.key:/run/secrets/transcript.key:ro
    # Hardening: read-only filesystem, no Linux capabilities, no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  data:
